[package]
name = "ghor_protocol_smoke"
version = "0.1.0"
edition = "2026"
kind = "bin"
license = "MIT"
authors = ["Aristote"]

[toolchain]
channel = "stable"
manager = "ncup"
components = ["ncc", "nfmt", "nlint", "nclsp"]

[target.default]
triple = "x86_64-unknown-linux-gnu"
abi = "sysv64"

[machine]
required = true
doctor = true
verify_object = true
disasm = true
roundtrip = true
parity = true
evidence = true

[basal]
enabled = true
seal = true
nbb = true
evidence = true

[runtime]
enabled = true

[compiler]
diagnostics = "strict"

[primitive]
enabled = false
real_hardware = false

[build]
orchestrator = "ghor"
graph = true

[features]
default = []

[capabilities]
machine = true
basal = true
foreign_adapters = true

[artifact]
kind = "ghor_project_build_plan"
format = "json"

[languages]
primary = "nC"
adapters = []


[dependencies]

[profiles.debug]
opt = 0
debug = true
evidence = true

[profiles.release]
opt = 3
debug = false
seal = true
evidence = true

[workspace]
members = [
    "crates/ncc",
    "crates/ncc-cli",
    "crates/ncc-ast",
    "crates/ncc-lexer",
    "crates/ncc-parser",
    "crates/ncc-stage0-bridge",
    "crates/ncc-diagnostics",
    "crates/ncc-ir",
    "crates/ncc-runtime",
    "crates/ncc-sema",
    "crates/ncc-backend",
    "crates/ncc-mct",
    "crates/ncc-primitive",
    "crates/ncc-machine",
    "crates/ncc-project",
    "crates/nfmt",
    "crates/nlint",
    "crates/nbuild",
    "crates/npkg",
    "crates/nide",
    "crates/nclsp",
    "crates/ncup",
    "crates/nwal"
]
resolver = "2"

[profile.dev]
incremental = false
debug = 1
opt-level = 1

[profile.test]
incremental = false
debug = 1
opt-level = 1

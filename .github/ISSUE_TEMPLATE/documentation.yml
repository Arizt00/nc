name: Mejorar la documentación
description: Un paso confuso, un enlace roto o un ejemplo que falta
body:
  - type: input
    id: page
    attributes:
      label: Página o archivo
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Qué intentabas hacer y dónde surgió la duda
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta o ejemplo que ayudaría

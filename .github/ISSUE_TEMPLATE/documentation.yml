name: Documentation improvement
description: An unclear step, broken link or missing example
body:
  - type: input
    id: page
    attributes:
      label: Page or file
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you were trying to do and where the documentation became unclear
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested correction or useful example

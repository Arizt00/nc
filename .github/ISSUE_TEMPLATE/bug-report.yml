name: Reproducible bug
description: A compiler, example or installation failure
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: Compiler and version
      description: Native kit or Stage0, version and SHA-256 when available
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Host and architecture
      placeholder: Windows x86-64 or Ubuntu 24.04 on WSL x86-64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal source and exact command
      description: Do not include credentials or personal data
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observed and expected result
      description: Include the diagnostic, output and exit code
    validations:
      required: true

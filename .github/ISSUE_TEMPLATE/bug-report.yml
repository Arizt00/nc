name: Error reproducible
description: Un fallo del compilador, un ejemplo o la instalación
title: "[Error] "
body:
  - type: input
    id: version
    attributes:
      label: Compilador y versión
      description: Kit nativo o Stage0, versión y SHA-256 si está disponible
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Sistema y arquitectura
      placeholder: Windows x86-64 o Ubuntu 24.04 en WSL x86-64
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Fuente mínima y comando exacto
      description: No incluyas credenciales ni datos personales
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Resultado obtenido y esperado
      description: Incluye diagnóstico, salida y exit code
    validations:
      required: true

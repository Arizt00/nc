name: Propuesta técnica
description: Un contrato o comportamiento del lenguaje
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema concreto y ejemplo
    validations:
      required: true
  - type: textarea
    id: continuity
    attributes:
      label: Contrato y continuidad
      description: Efecto sobre parser, AST, semántica, IR, máquina y runtime
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validación y límites
      description: Casos positivos, negativos y perfiles afectados

name: Technical proposal
description: A language contract or behavior
body:
  - type: textarea
    id: problem
    attributes:
      label: Concrete problem and example
    validations:
      required: true
  - type: textarea
    id: continuity
    attributes:
      label: Contract and continuity
      description: Effect on parser, AST, semantics, IR, machine code and runtime
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation and limits
      description: Positive cases, rejection cases and affected profiles

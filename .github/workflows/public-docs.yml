name: Public documentation
on:
  push:
    paths: ['docs/public/**', 'tools/publishing/**', 'sites/nc-language/**', '.github/workflows/public-docs.yml']
  pull_request:
    paths: ['docs/public/**', 'tools/publishing/**', 'sites/nc-language/**', '.github/workflows/public-docs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/publishing/build-site.mjs
      - run: node tools/publishing/check-public.mjs

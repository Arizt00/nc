[package]
name = "ncc-ir"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ncc-ast = { path = "../ncc-ast" }
ncc-diagnostics = { path = "../ncc-diagnostics" }
ncc-machine = { path = "../ncc-machine" }
ncc-parser = { path = "../ncc-parser" }
ncc-sema = { path = "../ncc-sema" }
ncc-stage0-bridge = { path = "../ncc-stage0-bridge" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
ncc-lexer = { path = "../ncc-lexer" }

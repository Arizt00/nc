[package]
name = "ncc-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
default-run = "ncc"

[dependencies]
ncc-lexer = { path = "../ncc-lexer" }
ncc-diagnostics = { path = "../ncc-diagnostics" }
ncc-parser = { path = "../ncc-parser" }
ncc-ast = { path = "../ncc-ast" }
ncc-ir = { path = "../ncc-ir" }
ncc-machine = { path = "../ncc-machine" }
ncc-runtime = { path = "../ncc-runtime" }
ncc-sema = { path = "../ncc-sema" }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
webpki-roots = "0.26"
libc = "0.2"
getrandom = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
kvm-bindings = "0.14.1"
kvm-ioctls = "0.25.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_System_Hypervisor"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
applevisor-sys = { version = "1.0.0", default-features = false, features = ["macos-11-0"] }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
xhypervisor = "0.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(ncc_public_beta)'] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "ncc"
path = "src/main.rs"

[[bin]]
name = "nfmt"
path = "src/bin/nfmt.rs"

[[bin]]
name = "nlint"
path = "src/bin/nlint.rs"

[[bin]]
name = "nbuild"
path = "src/bin/nbuild.rs"

[[bin]]
name = "npkg"
path = "src/bin/npkg.rs"

[[bin]]
name = "nide"
path = "src/bin/nide.rs"

[[bin]]
name = "nclsp"
path = "src/bin/nclsp.rs"

[[bin]]
name = "ncup"
path = "src/bin/ncup.rs"

[[bin]]
name = "ncup-init"
path = "src/bin/ncup-init.rs"

[[bin]]
name = "ghor"
path = "src/bin/ghor.rs"

[[bin]]
name = "nwal"
path = "src/bin/nwal.rs"

[[bin]]
name = "ncc-hvf-smoke"
path = "src/bin/ncc_hvf_smoke.rs"
